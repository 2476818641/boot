#CI项目
name: QCA-ALL

#CI计划
on:
  # 推送即编译。
  # 为什么要这条：GitHub 规定「手动 Run workflow」只对**默认分支上存在**的工作流可用 ——
  # 本仓库默认分支是 main（Q30 Pro 那套），这个 ax6600 配方只存在于 ax6600 分支，
  # 所以 Actions 界面里根本不会出现它的手动按钮；而 push 触发对任何分支都有效。
  # 只改文档/说明不触发编译（paths-ignore）。
  push:
    branches: [ax6600]
    paths-ignore:
      - 'Docs/**'
      - '**.md'
      - '.gitignore'
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES]
        # 默认只编 PLUS（想要纯净版把下面这行改回 [PURE, PLUS] 或只留 [PURE]）
        PROFILE: [PLUS]
        SOURCE: [ones20250/immortalwrt_ipq]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      #WRT_THEME: aurora
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.1.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本：PURE=纯净版，PLUS=Plus 版
      WRT_PROFILE: ${{matrix.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
