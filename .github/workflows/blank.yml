name: Build JCG Q30 (Custom U-Boot) 25.12

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 准备编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools libpython3-dev qemu-utils rs rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 拉取源码 (chasey-dev 25.12分支)
      run: |
        git clone -b 25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt

    - name: 更新及安装 Feeds 插件包
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成配置文件 (.config)
      working-directory: ./openwrt
      run: |
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        
        # 兼容 mt798x sdk 树结构
        CONFIG_TARGET_mediatek_mt7981=y
        CONFIG_TARGET_mediatek_mt7981_DEVICE_jcg_q30=y
        CONFIG_TARGET_mediatek_mt7981_DEVICE_jcg_q30-ubootmod=y
        
        # 兼容 filogic 主线树结构
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30-ubootmod=y
        
        # 基础 LuCI 界面与中文语言包
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        
        # 终端神器 ttyd
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
        
        # 基础网络工具
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_tcpdump=y
        CONFIG_PACKAGE_mtr=y
        CONFIG_PACKAGE_bind-dig=y
        CONFIG_PACKAGE_ip-full=y
        EOF
        
        # 自动补全依赖并清理无用的占位符
        make defconfig

    - name: 下载所需依赖包
      working-directory: ./openwrt
      run: |
        make download -j8 || make download -j1 V=s

    - name: 开始编译固件 (大约需要 1.5 - 2 小时)
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 整理编译好的固件文件
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到 GitHub 供下载
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-JCG_Q30-CustomUBoot-25.12
        path: ${{ env.FIRMWARE }}/*
