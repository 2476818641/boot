name: Build ImmortalWrt (JCG Q30 Pro / Q30)

# 云端编译：不需要本地环境，改完 .config 直接跑出固件
#   - 手动触发：Actions → 本工作流 → Run workflow（可填 tag / 是否发 Release）
#   - 自动触发：修改 .config / feeds.conf / 本工作流，或推送 v* tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则用 build-日期-时间）'
        required: false
        type: string
      make_release:
        description: '构建完成后创建 Release'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.config'
      - 'feeds.conf'
      - 'package/UA-Mask/**'
      - 'scripts/build-recovery-slim.sh'
      - 'scripts/recovery-slim-packages.txt'
      - 'scripts/check-package-selection.sh'
      - 'scripts/check-vendored-inputs.sh'
      - 'scripts/required-packages.txt'
      - '.github/workflows/build.yml'
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 拦一类「本地能编、云端必失败」的故障：编译需要的文件被 .gitignore 吃掉了，
      # 只在本地树里存在（干净检出就没有）。run #5 就是这样挂的 —— 当年 UA3F 的 Go 代码
      # 用 //go:embed 引用 4 个 eBPF .o，而根 .gitignore 的 `*.o` 把它们挡在仓库外，
      # 云端 3 秒就报 `pattern tc_bpfel.o: no matching files found`。
      # 放在这里（而不是编译之后）是为了 1 秒内失败，不浪费一小时。
      - name: 校验编译输入是否入库（.gitignore 陷阱）
        run: bash scripts/check-vendored-inputs.sh

      - name: 释放磁盘空间（OpenWrt 编译需要 ~25GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-venv rsync unzip zlib1g-dev file wget subversion swig time \
            libelf-dev ccache
          # 以下包在 Ubuntu 24.04 上可能已移除，失败不阻塞
          sudo apt-get install -y python3-distutils ecj fastjar java-propose-classpath || true

      - name: 切换到直连 GitHub（CI 在海外，无需镜像加速）
        run: |
          sed -i '/ghproxy/d' scripts/download.pl
          cp -f feeds.conf.default feeds.conf
          echo "--- download.pl 首行 ---"; head -3 scripts/download.pl
          echo "--- feeds.conf ---"; cat feeds.conf

      - name: 缓存源码包 dl/（后续构建大幅加速）
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf', '.config') }}
          restore-keys: |
            dl-

      # ⚠️ 这里有个大坑（2026-09-19 实测踩到，云端固件因此丢掉了 ua2f —— 当时的 UA 方案）：
      #    `./scripts/feeds update -a` 在结尾会调用 scripts/feeds 里的 refresh_config()，
      #    也就是**偷偷跑一次 `make defconfig`** 改写 .config。而此刻 package/feeds/ 还没建好
      #    （它被 .gitignore 忽略，全新检出时不存在），于是 defconfig 只看得到树内的包，
      #    所有"来自 feed 的已选包"被静默从 .config 删除（380 -> 292），
      #    后面的 install 和正式 defconfig 都救不回来 —— 因为 =y 那几行已经没了。
      #    对策：把提交进仓库的 .config 先备份，feeds 装完后原样还原。
      - name: 更新并安装 feeds（保护 .config 不被 feeds 脚本改写）
        run: |
          cp -f .config .config.committed
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if ! cmp -s .config .config.committed; then
            echo "::warning::scripts/feeds 改写了 .config（内部 refresh_config 跑了 defconfig）"
            echo "  改写前选中包数: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config.committed)"
            echo "  改写后选中包数: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config)"
            cp -f .config.committed .config
            echo "  已还原为仓库里的 .config"
          else
            echo "scripts/feeds 没有改写 .config ✅"
          fi

      - name: 应用 .config
        run: |
          set -o pipefail
          make defconfig 2>&1 | tee defconfig.log
          echo "=== 目标机型 ==="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config

      # 把"静默丢包"变成硬失败：拿仓库里提交的那份 .config 和 defconfig 之后的结果对比，
      # 缺任何一个关键包（uamask 等）就直接失败，并打印被丢掉的包清单。
      - name: 校验包选择（防止 defconfig 静默丢包）
        run: |
          bash scripts/check-package-selection.sh --config .config.committed .config

      - name: 预下载源码
        run: make -j$(nproc) download

      # ⚠️ 必须 set -o pipefail：`make | tee log` 的退出码默认是 **tee 的 0**，
      #    run #5 就是这样把 `make world` 的失败吞掉的 —— 编译早已挂了，流水线却继续
      #    往下跑精简 pass，最后上传了一份 11MB 的「正式固件」（其实是精简配置编出来的）。
      #    失败时再补一次 `-j1 V=s`：其余包都已编好，增量走一遍很快，能拿到真正的报错
      #    （并行构建默认不打印子包的错误详情，只留一句 "ERROR: package/xxx failed to build."）。
      - name: 编译
        run: |
          set -o pipefail
          if make -j$(nproc) 2>&1 | tee build.log; then
            echo "编译完成 ✅"
            exit 0
          fi
          echo "::error::编译失败 —— 用 -j1 V=s 重跑以取得真实报错（增量，不会重做已完成的包）"
          echo "===================== -j1 V=s 输出（尾部 120 行）====================="
          make -j1 V=s 2>&1 | tail -120 | tee -a build.log || true
          exit 1

      # 默认构建的第二步：原版 recovery 是 29MB（解包 ~95MB），在 256MB 内存的
      # JCG Q30 Pro 上必然 OOM。这里用 44 项保留清单再跑一遍镜像生成，
      # 把 9.0MB 精简版装回同名文件，并重建 sha256sums。
      - name: 精简 recovery 镜像（默认构建的一部分）
        run: |
          set -o pipefail
          bash scripts/build-recovery-slim.sh --slim-only 2>&1 | tee -a build.log

      - name: 校验产物（精简 recovery + 关键包）
        run: |
          cd bin/targets/mediatek/filogic
          ls -l *-initramfs-recovery.itb
          SIZE=$(stat -c%s *-initramfs-recovery.itb)
          echo "recovery 体积: $SIZE 字节"
          [ "$SIZE" -lt 12000000 ] || { echo "::error::recovery 不是精简版（期望 ~9.4MB）"; exit 1; }
          sha256sum -c sha256sums
          cd - >/dev/null
          # 正式固件的 manifest（精简装配阶段已把正式 manifest 还原回来）
          bash scripts/check-package-selection.sh --manifest bin/targets/mediatek/filogic/*.manifest

      - name: 收集产物
        if: success()
        run: |
          mkdir -p out
          cd bin/targets/mediatek/filogic
          cp -v *-squashfs-sysupgrade.itb \
                *-initramfs-recovery.itb \
                *-bl31-uboot.fip \
                *-preloader.bin \
                mt7981-ram-ddr3-bl2.bin \
                sha256sums profiles.json ../../../../out/ 2>/dev/null || true
          cp -v *.manifest ../../../../out/ 2>/dev/null || true
          # 精简版的包清单（正式 manifest 已在装配阶段还原，这里留一份核对用）
          cp -v ../../../../recovery-slim-out/recovery-slim.manifest ../../../../out/ 2>/dev/null || true
          cd ../../../../out && ls -lh

      - name: 上传产物（Artifacts）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jcg_q30-pro-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: success() && (github.event_name == 'push' || inputs.make_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="build-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/* \
            --title "ImmortalWrt JCG Q30 Pro/Q30 $TAG" \
            --notes "云端编译产物（ImmortalWrt 25.12 rebase，目标 mediatek/filogic jcg_q30-pro）。

          **刷机请务必先读硬刷方案文档：[docs/jcg-q30-pro/HUMAN-GUIDE.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/jcg-q30-pro/HUMAN-GUIDE.md)**

          | 文件 | 用途 |
          |---|---|
          | \`*-squashfs-sysupgrade.itb\` | 正式固件 → 写 \`fit\` 卷 / LuCI 升级 |
          | \`*-bl31-uboot.fip\` | U-Boot 本体 → 写 \`fip\` 分区 |
          | \`*-preloader.bin\` | BL2 → 写 \`bl2\` 分区（通常不用写）|
          | \`*-initramfs-recovery.itb\` | 内存系统，**已是 9.0MB 精简版** → 按住 reset + TFTP 救砖用 |
          | \`mt7981-ram-ddr3-bl2.bin\` | **给 mtk_uartboot 用的 RAM BL2**（不是 preloader！）|

          校验值见 \`sha256sums\`。"

      - name: 编译失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            defconfig.log
            .config.committed
            .config
            recovery-slim-build.log
            build-production.log
            logs/
          if-no-files-found: ignore
          retention-days: 7
